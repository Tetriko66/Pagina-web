 <!DOCTYPE html>
<html lang="es">
    <head>
        
        <!--Soporta acentos y ñ-->
         <meta charset="UTF-8">
        <title>Lo quieres, te lo vendo</title>
        
        <!--Conecta con css para personalizar diseños-->
        <link rel="stylesheet" href="span.css">
        
        <!--Conecta bootstrap-->
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    
    <!--Body para abajo es el archivo visible de la pagina web-->
<body>
        
        <!--Hace la clase con la barra responsiva y el fondo blanco-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
            
            <!--Contenedor que ocupa todo el ancho-->
        <div class="container-fluid"> 

                <!--Nombre o logo del sitio-->
                <a class="navbar-brand" href="#" ><strong>Lo quieres, te lo vendo</strong></a>
                <!--boton que aoarece en la pagina para desplegar el menu-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
                        aria-expanded="false" aria-label="Toggle navigation">
                    <!--Icono del boton de hamburguesa(≡)-->
                    <span class="navbar-toggler-icon"></span>
                </button>

            <!--Contenedor que abre y cierra en pantallas pequeñas-->
            <div class="collapse navbar-collapse " id="navbarSupportedContent">
                <!--Lista de enlaces al menu-->
                <ul class="navbar-nav mx-auto d-flex flex-row">
                    <!--Opciones-->
                    <li class="nav-item mx-2">  <a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item mx-2">  <a class="nav-link " href="#">Nosotros</a></li>
                    <li class="nav-item mx-2">  <a class="nav-link " href="#">Tienda</a></li>
                    <li class="nav-item dropdown">
                        <!--Enlace dentro de cada opcion-->
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">Mas</a>
                         <!--Menu desplegable con mas opciones--> 
                        <ul class="dropdown-menu">
                            <a class="dropdown-item" href="#">Contactos</a>
                            <a class="dropdown-item" href="#">Ayuda</a>
                            <a class="dropdown-item" href="#">Configuraciones</a>
                        </ul>
                    </li>
                </ul>
                <!--Formulario donde se puede escribir-->
                <!--class="d-flex formulario" → d-flex lo pone en fila horizontal, formulario es tu clase personalizada.-->
                <!--onsubmit="checkear_formulario(); return false;" → Cuando se envía, ejecuta tu función JavaScript y evita recargar la página.-->
                <form class="d-flex formulario ms-auto" role="search" onsubmit="checkear_formulario(); return false;">
                    <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search" style="width:500px;">
                    <button class="btn btn-dark" type="submit">Buscar</button>
                </form>
            </div>
        </div>

    <!--Contendio visible-->
