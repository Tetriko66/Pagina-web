    <body>
        <!--Hace la clase con la barra responsiva y el fondo blanco-->

            <!--Contenedor que ocupa todo el ancho-->

                <!--Nombre / logo del sitio-->
                <a class="navbar-brand" href="TIENDA.html">
                    <img src="https://scontent-scl3-1.xx.fbcdn.net/v/t1.15752-9/792403671_2229745870920506_6433620883171959035_n.png?stp=dst-png_s960x960&_nc_cat=101&ccb=1-7&_nc_sid=9f807c&_nc_ohc=xjh6nu9JmPcQ7kNvwEQSIlR&_nc_oc=AdqPSvcDhOc1YusN3bd9NXGfSBibRZ-5IBMyjrT6nliE5YyuhgzDF14h5gK6Nyvbuyp_xhm8qWXR0MsAboe_FfQd&_nc_zt=23&_nc_ht=scontent-scl3-1.xx&_nc_ss=7b6a8&oh=03_Q7cD6QFWXMJJc-Go1P8YEdKS-33kVpb-ACWfBstZJMFlC1_9HA&oe=6A9ECE80"                         alt="Logo" 
                         width="45" 
                         height="45"
                         class="d-inline-block align-text-center">
                    <strong>LevelUp</strong>
                </a>
                <!--boton que aparece en la pagina para desplegar el menu-->
                <button class="navbar-toggler" 
                        type="button" 
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" 
                        aria-controls="navbarSupportedContent"
                        aria-expanded="false" 
                        aria-label="Toggle navigation">
                    <!--Icono del boton de hamburguesa(≡)-->
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!--Contenedor que abre y cierra en pantallas pequeñas-->
                <div class="collapse navbar-collapse " id="navbarSupportedContent">
                    
                    <!--Lista de enlaces al menu-->
                    <ul class="navbar-nav mx-auto d-flex flex-row">

                        <!--Opciones-->
                        <li class="nav-item mx-2">  
                            <a class="nav-link active" 
                               href="TIENDA.html">Home</a></li>

                        <li class="nav-item mx-2">

                               href="Nosotros.html">Nosotros</a></li>

                        <li class="nav-item mx-2">  
                            <a class="nav-link " 
                               href="Sucursal.html">Sucursal</a></li>

                        <li class="nav-item dropdown">
                    
                            <!--Enlace dentro de cada opcion-->

                               href="#" role="button"
                               data-bs-toggle="dropdown" 
                               aria-expanded="false">Mas</a>

                            <!--Menu desplegable con mas opciones--> 
                            <ul class="dropdown-menu">
                                <a class="dropdown-item" href="Contacto.html">Contacto</a>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Contenido de la página de Contacto -->
        <section class="container mt-5">

            <!--Nombre / logo del sitio-->
            <div class="text-center mb-4">
                <img src="https://scontent-scl3-1.xx.fbcdn.net/v/t1.15752-9/792403671_2229745870920506_6433620883171959035_n.png?stp=dst-png_s960x960&_nc_cat=101&ccb=1-7&_nc_sid=9f807c&_nc_ohc=xjh6nu9JmPcQ7kNvwEQSIlR&_nc_oc=AdqPSvcDhOc1YusN3bd9NXGfSBibRZ-5IBMyjrT6nliE5YyuhgzDF14h5gK6Nyvbuyp_xhm8qWXR0MsAboe_FfQd&_nc_zt=23&_nc_ht=scontent-scl3-1.xx&_nc_ss=7b6a8&oh=03_Q7cD6QFWXMJJc-Go1P8YEdKS-33kVpb-ACWfBstZJMFlC1_9HA&oe=6A9ECE80"
                     alt="Logo LevelUp"
                     width="160"
                     height="90">
                <h1 class="mt-3">LevelUp</h1>
            </div>

                <!-- Formulario completo -->
            <div class="formulario-contacto">

                <h2 class="titulo-contacto">
                    FORMULARIO DE CONTACTOS
                </h2>

                <!-- Todo lo que este dentro formará parte del formulario -->
                <form id="formularioContacto"
                      onsubmit="validar_contacto(); return false;"> <!-- evita que se recargue la página al enviar el formulario -->
                    
                    <!-- Nombre completo -->
                    <div class="mb-3">
                        
                        <label for="nombre"
                            class="form-label"> <!-- "from label" es una clase Bootstrap--> 
                            NOMBRE COMPLETO
                        </label>

                        <!-- Espacio para que el usuario ingrese su nombre completo -->
                        <input type="text"
                            class="form-control" 
                            id="nombre" 
                            name="nombre">
                        <!-- Mensaje de error -->
                        <small id="errorNombre" class="text-danger"></small>
                    </div> 

                    <!-- Correo -->
                    <div class="mb-3">
                        <label for="correo" 
                            class="form-label">
                            CORREO
                        </label>

                        <input  type="text"
                                class="form-control"
                                id="correo"
                                name="correo"
                                autocomplete="email"
                                placeholder="Ejemplo: nombre@correo.cl">
    
                        <!-- Mensaje de error -->
                        <small id="errorCorreo" class="text-danger"></small>

                    </div>

                    <!-- Box Mensaje -->
                    <div class="mb-4">
                        <label for="mensaje"    
                            class="form-label">
                            MENSAJE
                        </label>

                        <textarea   class="form-control"
                                    id="mensaje"
                                    name="mensaje"
                                    rows="5"
                                    placeholder="Escribe tu consulta aquí"></textarea>

                        <!-- Mensaje de error -->
                        <small id="errorMensaje" class="text-danger"></small>
                    </div>

                    <!-- MENSAJE GENERAL -->
                    <div  id="resultadoFormulario" 
                        class="text-center mb-3">
                    </div>      

                    <!-- Botón -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-outline-dark">
                            ENVIAR MENSAJE
                        </button>

                    </div>
                </form>
            </div>
        </section>

        <footer id="Creador" class="footer mt-5">
            <ul>
                <small>©2026 LevelUp</small>
            </ul>
        </footer>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Tu archivo JavaScript -->
    <script src="funciones.js"></script>

    </body>
</html>
