<!DOCTYPE html>
<html lang="es">
<head>
    <title>Contacto</title>

    <!--Soporta acentos y ñ-->
    <meta charset="UTF-8">

    <!--Conecta con css para personalizar diseños-->
    <link rel="stylesheet" href="span.css">

    <!--Conecta bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!--Hace la clase con la barra responsiva y el fondo blanco-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">

        <!--Contenedor que ocupa todo el ancho-->
        <div class="container-fluid">

            <!--Nombre / logo del sitio-->
            <a class="navbar-brand" href="TIENDA.html">
                <img src="https://www.holded.com/images/og/blog/que-es-ecommerce.jpg"
                     alt="Logo" width="45" height="45"
                     class="d-inline-block align-text-center">
                <strong>TecnoCollab</strong>
            </a>
            <!--boton que aparece en la pagina para desplegar el menu-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <!--Icono del boton de hamburguesa(≡)-->
                <span class="navbar-toggler-icon"></span>
            </button>

            <!--Contenedor que abre y cierra en pantallas pequeñas-->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <!--Lista de enlaces al menu-->
                <ul class="navbar-nav mx-auto d-flex flex-row">
                    <!--Opciones-->
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="TIENDA.html">Home</a></li>
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="Nosotros.html">Nosotros</a></li>
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="Sucursal.html">Sucursal</a></li>
                    <li class="nav-item dropdown">
                        <!--Enlace dentro de cada opcion-->
                        <a class="nav-link dropdown-toggle active" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">Mas</a>
                        <!--Menu desplegable con mas opciones-->
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="Contacto.html">Contacto</a></li>
                            <li><a class="dropdown-item" href="Blogs.html">Blogs</a></li>
                        </ul>
                    </li>
                </ul>
                <!--Formulario donde se puede escribir-->
                <form class="d-flex formulario ms-auto" role="search" onsubmit="checkear_formulario(); return false;">
                    <input id="buscador" class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search" style="width:500px;">
                    <button class="btn btn-dark" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Contenido de la página de Contacto -->
<section class="container mt-5">

    <!--Nombre / logo del sitio-->
    <div class="text-center mb-4">
        <img src="https://www.holded.com/images/og/blog/que-es-ecommerce.jpg"
             alt="Logo TecnoCollab"
             width="160"
             height="90">
        <h1 class="mt-3">TecnoCollab</h1>
    </div>

    <!-- Formulario completo -->
    <div class="formulario-contacto">

        <h2 class="titulo-contacto">
            FORMULARIO DE CONTACTOS
        </h2>

        <form> <!-- Todo lo que este dentro formará parte del formulario -->
            <!-- Nombre completo -->
            <div class="mb-3">
                
                <label for="nombre" class="form-label"> <!-- "from label" es una clase Bootstrap--> 
                    NOMBRE COMPLETO
                </label>

                <!-- Espacio para que el usuario ingrese su nombre completo -->
                <input
                    type="text"
                    class="form-control" 
                    id="nombre" 
                    name="nombre"
                    required> <!-- HTML valida automaticamente el input -->
            </div> 

            <!-- Correo -->
            <div class="mb-3">
                <label for="correo" class="form-label">
                    CORREO
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="correo"
                    name="correo"
                    required> <!-- HTML valida automaticamente el input -->
            </div>

            <!-- Mensaje -->
            <div class="mb-4">
                <label for="Mensaje" class="form-label">
                    MENSAJE
                </label>

                <textarea
                    class="form-control"
                    id="Mensaje"
                    name="Mensaje"
                    rows="5"
                    required></textarea>
            </div>

            <!-- Botón -->
            <div class="text-center">
                <button type="submit" class="btn btn-outline-dark">
                    ENVIAR MENSAJE
                </button>

            </div>
        </form>
    </div>

</section>

    <footer id="Creador" class="bg-dark text-white p-3 mt-5">
        <ul>
            <small><li>Vicente Rodriguez</li></small>
            <small><li>Sebastian Valderrama</li></small>
            <small>©2026 TecnoCollab</small>
        </ul>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Tu archivo JavaScript -->
    <script src="funciones.js"></script>

</body>
</html>
